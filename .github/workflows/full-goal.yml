name: Verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned Lean toolchain
        run: |
          curl --fail --location --retry 3 https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib's build cache
        run: lake exe cache get
      - name: Build all project modules
        run: lake build
      - name: Check the final statement and axioms
        run: lake env lean Sechstmoment/Verification/Final.lean
